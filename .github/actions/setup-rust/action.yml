name: Setup pinned Rust
description: Install the toolchain and components pinned in rust-toolchain.toml

# Single source of truth for the CI toolchain: `rust-toolchain.toml` at the
# repository root. A literal channel here or in a workflow would drift from the
# file, so `just ci-contract` rejects one.
runs:
  using: composite
  steps:
    - name: Read the repository toolchain pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel *= *"\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        components="$(sed -n 's/^components *= *\[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d ' "')"
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
    - name: Install the pinned toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ steps.pin.outputs.components }}
