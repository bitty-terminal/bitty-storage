[package]
name = "bitty-storage"
description = "Bounded isolated storage mechanics for Bitty Correct Terminal"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-storage"
keywords = ["terminal", "storage", "bitty"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "bitty_storage"
path = "src/lib.rs"

[[bin]]
name = "bitty-storage"
path = "src/bin/bitty-storage.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Namespace locks are OS advisory `flock`s, safe API only (no `unsafe`).
# Same platform split as the Core/execution claim lock; the Linux x86_64
# component is the packaged target for this task.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
